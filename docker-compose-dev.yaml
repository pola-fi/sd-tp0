name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_EXPECTED_AGENCIES=7
    volumes:
      - ./server/config.ini:/app/config.ini
    networks:
      - testing_net

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - AGENCY_ID=1
      - NOMBRE=Ana
      - APELLIDO=Diaz
      - DOCUMENTO=10011849
      - NACIMIENTO=1989-11-05
      - NUMERO=4758
    volumes:
      - ./client/config.yaml:/app/config.yaml
      - ./.data:/app/.data
    networks:
      - testing_net
    depends_on:
      - server

  client2:
    container_name: client2
