name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /app/main.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./server/config.ini:/app/config.ini
    networks:
      - testing_net

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - AGENCY_ID=1
      - NOMBRE=Carlos
      - APELLIDO=Perez
      - DOCUMENTO=10003143
      - NACIMIENTO=1974-10-21
      - NUMERO=5051
    volumes:
      - ./client/config.yaml:/app/config.yaml
    networks:
      - testing_net
    depends_on:
      - server

  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - AGENCY_ID=2
      - NOMBRE=Juan
      - APELLIDO=Ramirez
      - DOCUMENTO=10003071
      - NACIMIENTO=1985-05-25
      - NUMERO=4980
    volumes:
      - ./client/config.yaml:/app/config.yaml
    networks:
      - testing_net
    depends_on:
      - server

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
